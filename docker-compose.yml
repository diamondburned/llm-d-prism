version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    working_dir: /app
    volumes:
      - .:/app
      - ~/.config/gcloud/application_default_credentials.json:/tmp/adc.json
    environment:
      - GOOGLE_APPLICATION_DEFAULT_CREDENTIALS=/tmp/adc.json
      - PORT=3000
      - RESULTS_STORE_BUCKET=llm-d-benchmarks-staging
      - DEFAULT_BUCKETS=llm-d-benchmarks,llm-d-benchmarks-staging
      - RESULTS_STORE_PLAYGROUND_MODE=${RESULTS_STORE_PLAYGROUND_MODE:-1}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - PUBLIC_URL=http://localhost:8081
      - GIT_COMMIT=${GIT_COMMIT:-}
    ports:
      - "8081:5173"
      - "3000:3000"
    command: sh -c "export GIT_COMMIT=$${GIT_COMMIT:-$$(git describe --always --dirty 2>/dev/null)}; npm install && npm run dev"
